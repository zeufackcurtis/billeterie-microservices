version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: ticketflow-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ticketflow_db
      MYSQL_USER: ticketflow_user
      MYSQL_PASSWORD: ticketflow_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: